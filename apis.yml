  relying on intensive clinic hours. Services span emotional regulation, communication development, social
  engagement, daily living skills, and 1:1 parent coaching, with insurance-based access across multiple
  US locations. Surfaced as an obvious-ventures portfolio company and added to the API Evangelist network;
